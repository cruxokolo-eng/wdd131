<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filtered Temple Gallery</title>
    <meta name="description" content="Temple gallery with responsive filtering and lazy-loaded temple cards." />
    <meta name="author" content="Crux Okolo" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <footer>
